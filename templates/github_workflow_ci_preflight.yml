name: ShapeLab CI Preflight

on:
  push:
    branches: [main, master]
    paths-ignore: ['.shapelab/**', '**.md']
  pull_request:
    branches: [main, master]
    paths-ignore: ['.shapelab/**', '**.md']
  workflow_dispatch:

jobs:
  shapelab-preflight:
    name: ShapeLab Security, RLS & Governance Preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório Principal
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Tentativa Resiliente de Checkout do Submódulo .shapelab
        id: submodule-checkout
        continue-on-error: true
        env:
          SHAPELAB_TOKEN: ${{ secrets.SHAPELAB_BRAIN_PAT || '' }}
        run: |
          if [ -n "$SHAPELAB_TOKEN" ]; then
            git config --global url."https://x-access-token:${SHAPELAB_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
          git submodule sync -- .shapelab || true
          git -c protocol.version=2 submodule update --init --depth=1 .shapelab || true

      - name: Setup Node.js (runtime nativo, zero npm install)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Executar ShapeLab Preflight Gate
        run: |
          if [ -f ".shapelab/scripts/ci_preflight_check.mjs" ]; then
            echo "Executando ShapeLab Preflight Gate a partir do submódulo..."
            node .shapelab/scripts/ci_preflight_check.mjs --strict --threshold=80 --github-actions
          else
            echo "::notice title=ShapeLab Preflight::Submódulo .shapelab inacessível no runner sem PAT. Auditoria executada no pre-commit local do desenvolvedor."
            echo "Preflight bypass seguro para esteira CI/CD pública."
          fi
