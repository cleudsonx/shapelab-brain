name: Validate SemVer & Create Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validar SemVer e CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar incremento de VERSION e entrada no CHANGELOG.md
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          def run_git(*args: str) -> subprocess.CompletedProcess[str]:
              return subprocess.run(["git", *args], text=True, capture_output=True)

          event_name = os.environ.get("EVENT_NAME", "")
          base_ref = os.environ.get("BASE_REF", "")

          if event_name == "pull_request" and base_ref:
              base_rev = f"origin/{base_ref}"
          else:
              chk = run_git("rev-parse", "--verify", "HEAD~1")
              if chk.returncode != 0:
                  print("Commit inicial detectado; validação de diff ignorada.")
                  sys.exit(0)
              base_rev = "HEAD~1"

          diff_res = run_git("diff", "--name-only", base_rev, "HEAD")
          if diff_res.returncode != 0:
              print(diff_res.stderr, file=sys.stderr)
              sys.exit(1)

          changed = [line.strip() for line in diff_res.stdout.splitlines() if line.strip()]
          print("Arquivos alterados:", changed)

          governed_prefixes = ("skills/", "agents/", "memory/")
          requires_bump = any(
              f == "CORE_CONSTITUTION.md" or f.startswith(governed_prefixes)
              for f in changed
          )

          if not requires_bump:
              print("Nenhuma alteração em skills/, agents/, memory/ ou CORE_CONSTITUTION.md.")
              sys.exit(0)

          if "VERSION" not in changed:
              print("ERRO: Alterações em skills/, agents/, memory/ ou CORE_CONSTITUTION.md exigem incremento em VERSION.", file=sys.stderr)
              sys.exit(1)

          new_ver = Path("VERSION").read_text(encoding="utf-8").strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+", new_ver):
              print(f"ERRO: VERSION '{new_ver}' não segue SemVer X.Y.Z.", file=sys.stderr)
              sys.exit(1)

          old_res = run_git("show", f"{base_rev}:VERSION")
          if old_res.returncode == 0:
              old_ver = old_res.stdout.strip()
              if re.fullmatch(r"\d+\.\d+\.\d+", old_ver):
                  new_tuple = tuple(int(x) for x in new_ver.split("."))
                  old_tuple = tuple(int(x) for x in old_ver.split("."))
                  if new_tuple <= old_tuple:
                      print(f"ERRO: Nova versão ({new_ver}) deve ser estritamente maior que a anterior ({old_ver}).", file=sys.stderr)
                      sys.exit(1)

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          if f"## [{new_ver}]" not in changelog:
              print(f"ERRO: CHANGELOG.md não contém a seção '## [{new_ver}]'.", file=sys.stderr)
              sys.exit(1)

          print(f"Validação SemVer OK: {new_ver}")
          PY

  release:
    name: Publicar Tag e GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar tag e publicar Release se ainda não existir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="$(tr -d ' \r\n' < VERSION)"
          if [ -z "$VER" ]; then
            echo "VERSION vazio" >&2
            exit 1
          fi

          TAG="v${VER}"
          if [ -n "$(git ls-remote --tags origin "refs/tags/${TAG}")" ]; then
            echo "Tag ${TAG} já existe no remoto. Nenhuma release criada."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Shapelab Brain ${TAG}"
          git push origin "${TAG}"

          python3 - <<'PY'
          import re
          from pathlib import Path

          ver = Path("VERSION").read_text(encoding="utf-8").strip()
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"^## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(changelog)
          notes = match.group(1).strip() if match else f"Release v{ver}"
          Path("release_notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

          gh release create "${TAG}" --title "Shapelab Brain ${TAG}" --notes-file release_notes.md
