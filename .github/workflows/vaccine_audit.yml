name: Weekly Vaccine Audit

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

jobs:
  audit-matrix:
    name: Validar Matriz de Vacinas e Integridade do Brain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do shapelab-brain
        uses: actions/checkout@v4

      - name: Verificar integridade de VERSION, CHANGELOG, INDEX e PRODUCT_MATRIX
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          ver = Path("VERSION").read_text(encoding="utf-8").strip()
          assert re.fullmatch(r"\d+\.\d+\.\d+", ver), f"VERSION inválido: {ver}"
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          assert f"## [{ver}]" in changelog, f"CHANGELOG sem seção ## [{ver}]"
          manifest = json.loads(Path("assets/brand/brand_manifest.json").read_text(encoding="utf-8"))
          assert Path(manifest["assets"]["logo_square"]["path"]).exists()
          assert Path(manifest["assets"]["banner_wide"]["path"]).exists()

          matrix = Path("memory/PRODUCT_MATRIX.md").read_text(encoding="utf-8")
          pending_lines = [l for l in matrix.splitlines() if "⏳" in l]
          print(f"Brain v{ver} íntegro. Linhas com vacinas planejadas/pendentes: {len(pending_lines)}")
          PY
